# Job Hunter, all of it: `docker compose up --build`, then http://localhost:3420.
# Needs a .env beside this file - run scripts/setup-env.sh once (README).
# On a server, add deploy/docker-compose.prod.yml (docs/self-hosting.md).
# Every port is bound to 127.0.0.1: nothing here is reachable from other machines.

name: job-hunter

x-api: &api
  build:
    context: .
    dockerfile: deploy/api.Dockerfile
  image: job-hunter-api:local
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql+psycopg://jobhunter:${POSTGRES_PASSWORD:?run scripts/setup-env.sh first}@db:5432/jobhunter
    BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:?run scripts/setup-env.sh first}
    ENVIRONMENT: ${ENVIRONMENT:-development}
    JOB_SOURCES: ${JOB_SOURCES:-demo}
    COMMERCIAL_ONLY: ${COMMERCIAL_ONLY:-false}
    HIMALAYAS_API_KEY: ${HIMALAYAS_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    AI_PROVIDER: ${AI_PROVIDER:-auto}
    AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
    AI_EFFORT: ${AI_EFFORT:-low}
    AI_THINKING: ${AI_THINKING:-false}
    AI_AUTO_SCORE: ${AI_AUTO_SCORE:-true}
    AI_SCORES_PER_MONTH: ${AI_SCORES_PER_MONTH:-300}
    AI_BUDGET_USD_PER_MONTH: ${AI_BUDGET_USD_PER_MONTH:-5}
    # Generated files (CV PDFs): the storage service below, unless S3_* point
    # elsewhere - Cloudflare R2, AWS S3 (docs/self-hosting.md).
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://storage:7070}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-job-hunter}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${STORAGE_ACCESS_KEY:?run scripts/setup-env.sh first}}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${STORAGE_SECRET_KEY:?run scripts/setup-env.sh first}}
    BILLING_ENABLED: ${BILLING_ENABLED:-false}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup-env.sh first}
      POSTGRES_DB: jobhunter
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Brings the database schema up to date, then exits. api and worker wait for it.
  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    ports:
      - "127.0.0.1:8420:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    <<: *api
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    # Healthy while its loop keeps turning (a heartbeat file; app/worker.py).
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--alive"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: job-hunter-web:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jobhunter:${POSTGRES_PASSWORD}@db:5432/jobhunter
      AUTH_SECRET: ${AUTH_SECRET:?run scripts/setup-env.sh first}
      AUTH_URL: ${AUTH_URL:-http://localhost:3420}
      AUTH_TRUST_HOST: "true"
      BACKEND_URL: http://api:8000
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET}
      EMAIL_SERVER: ${EMAIL_SERVER:-smtp://mailpit:1025}
      EMAIL_FROM: ${EMAIL_FROM:-Job Hunter <no-reply@localhost>}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    ports:
      - "127.0.0.1:3420:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/signin').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible storage for generated files (CV PDFs): the Versity S3
  # Gateway, keeping them as plain files in the storage-data volume.
  storage:
    image: versity/versitygw:v1.10.0
    restart: unless-stopped
    environment:
      ROOT_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?run scripts/setup-env.sh first}
      ROOT_SECRET_KEY: ${STORAGE_SECRET_KEY:?run scripts/setup-env.sh first}
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      VGW_PORT: ":7070"
      VGW_HEALTH: /health
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Billing in development: forwards Stripe's test-mode events to the API.
  # Only with `docker compose --profile billing up`, and STRIPE_SECRET_KEY (a
  # test key) in .env - see docs/billing.md.
  stripe:
    image: stripe/stripe-cli:v1.55.6
    profiles: ["billing"]
    restart: unless-stopped
    command: ["listen", "--forward-to", "http://api:8000/billing/webhook"]
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      api:
        condition: service_healthy

  # Catches every email the app sends (sign-in links): http://localhost:8025
  # Its image has its own health check.
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  db-data:
  storage-data:
