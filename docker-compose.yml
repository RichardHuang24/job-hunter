# Job Hunter, all of it: `docker compose up --build`, then http://localhost:3420.
# Needs a .env beside this file - run scripts/setup-env.sh once (README).
# On a server, add deploy/docker-compose.prod.yml (docs/self-hosting.md).
# Every port is bound to 127.0.0.1: nothing here is reachable from other machines.

name: job-hunter

x-api: &api
  build:
    context: .
    dockerfile: deploy/api.Dockerfile
  image: job-hunter-api:local
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql+psycopg://jobhunter:${POSTGRES_PASSWORD:?run scripts/setup-env.sh first}@db:5432/jobhunter
    BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:?run scripts/setup-env.sh first}
    ENVIRONMENT: ${ENVIRONMENT:-development}
    JOB_SOURCES: ${JOB_SOURCES:-demo}
    COMMERCIAL_ONLY: ${COMMERCIAL_ONLY:-false}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup-env.sh first}
      POSTGRES_DB: jobhunter
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Brings the database schema up to date, then exits. api and worker wait for it.
  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    ports:
      - "127.0.0.1:8420:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    <<: *api
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: job-hunter-web:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jobhunter:${POSTGRES_PASSWORD}@db:5432/jobhunter
      AUTH_SECRET: ${AUTH_SECRET:?run scripts/setup-env.sh first}
      AUTH_URL: ${AUTH_URL:-http://localhost:3420}
      AUTH_TRUST_HOST: "true"
      BACKEND_URL: http://api:8000
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET}
      EMAIL_SERVER: ${EMAIL_SERVER:-smtp://mailpit:1025}
      EMAIL_FROM: ${EMAIL_FROM:-Job Hunter <no-reply@localhost>}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    ports:
      - "127.0.0.1:3420:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/signin').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Catches every email the app sends (sign-in links): http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  db-data:
