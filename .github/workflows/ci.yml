name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (SQLite and Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobhunter
          POSTGRES_PASSWORD: jobhunter
          POSTGRES_DB: jobhunter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobhunter -d jobhunter_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: pytest
      - name: Tests on Postgres
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://jobhunter:jobhunter@localhost:5432/jobhunter_test
      - name: Migrations go up, match the models, and come down
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
        env:
          DATABASE_URL: postgresql+psycopg://jobhunter:jobhunter@localhost:5432/jobhunter_test

  web:
    name: Web lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  guard:
    name: Secrets and personal data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (every commit)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
      - name: Personal data (emails, phone numbers, files that never belong here)
        run: python3 scripts/check_public_data.py --all

  docker:
    name: Docker stack, end to end (${{ matrix.arch }})
    # A clean machine, as in the README: set up .env, `docker compose up`,
    # wait for every service's health check, then use it over HTTP and in a
    # real browser. On Intel/AMD and on ARM (GitHub's arm64 runners).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/setup-env.sh
      - name: Use the sample jobs, so the run is predictable and calls no job board
        run: sed -i 's/^JOB_SOURCES=.*/JOB_SOURCES=demo/' .env
      - name: The production setup is valid
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml config --quiet
        env:
          DOMAIN: jobs.example.com
          EMAIL_SERVER: smtp://user:password@smtp.example.com:587
      - name: Build and start
        run: docker compose up --build --detach
      - name: Every service is healthy
        run: |
          services="db api worker web mailpit"
          for _ in $(seq 1 120); do
            healthy=$(docker compose ps --format '{{.Service}} {{.Health}}' | awk '$2 == "healthy" {print $1}' | sort | xargs)
            [ "$healthy" = "$(echo $services | tr ' ' '\n' | sort | xargs)" ] && { echo "Healthy: $healthy"; exit 0; }
            sleep 2
          done
          docker compose ps
          echo "Not every service became healthy." && exit 1
      - name: The migrations ran
        run: test "$(docker compose ps --all --format '{{.Service}} {{.State}} {{.ExitCode}}' | grep '^migrate ')" = "migrate exited 0"
      - run: curl -fsS http://localhost:8420/health
      - name: Sign in by email, set up, search, score - over HTTP
        run: python3 scripts/smoke_test.py
      - name: The worker runs tasks
        run: docker compose exec -T worker python -m app.worker --check --timeout 30
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the browser
        run: |
          pip install -r scripts/requirements-e2e.txt
          python -m playwright install --with-deps --only-shell chromium
      - name: The same, in a real browser
        run: python3 scripts/browser_test.py
      - name: Screenshot of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-${{ matrix.arch }}
          path: browser-test/
          if-no-files-found: ignore
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
